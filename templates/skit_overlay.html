<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Skit overlay</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Filled by `bh compose` (templates/skit_overlay.html). Timing is inlined in #skit-data below. */
  html, body { margin: 0; background: #000; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0d14;
          font-family: "Inter", sans-serif; color: #fff; }
  #shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .layer { position: absolute; left: 0; width: 100%; pointer-events: none; }

  /* captions: each box is a flex row centred on its anchor line, so no CSS transform is needed */
  .cap-zone { position: absolute; left: 10%; width: 80%; height: 360px; display: flex;
              align-items: center; justify-content: center; text-align: center; }
  .cap-zone > .line { position: absolute; opacity: 0; max-width: 100%; }
  .style-subtitle .cap-zone { top: calc(37% - 180px); }
  .style-subtitle .line { font-family: "Inter", sans-serif; font-weight: 500; font-size: 46px; line-height: 1.25; color: #fff;
                          text-shadow: 0 2px 10px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.5); }
  .style-punch .cap-zone { top: calc(75% - 180px); }
  .style-punch .line { font-family: "Inter", sans-serif; font-weight: 800; font-size: 64px; line-height: 1.1; color: #fff; letter-spacing: -0.01em;
                       text-shadow: 0 3px 12px rgba(0,0,0,.7), 0 0 3px rgba(0,0,0,.6); }
  .style-punch .line.hot { color: #F2B640; }
  .style-story .cap-zone { top: calc(80% - 180px); }
  .style-story .line { font-family: "EB Garamond", serif; font-weight: 400; font-size: 40px; line-height: 1.35; color: rgba(255,255,255,.9);
                       text-shadow: 0 2px 12px rgba(0,0,0,.6); }

  /* counter card */
  .card { position: absolute; top: 6%; left: 18%; width: 64%; box-sizing: border-box; padding: 30px 40px 36px;
          background: rgba(20,21,27,.85); border: 1px solid rgba(255,255,255,.12); border-radius: 28px; opacity: 0; }
  .card .label { font-family: "Inter", sans-serif; font-weight: 500; font-size: 26px; line-height: 1.2; color: #9aa0ae; }
  .card .row { display: flex; align-items: baseline; gap: 16px; margin-top: 6px; }
  .card .value { font-family: "Inter", sans-serif; font-weight: 700; font-size: 150px; line-height: 1.05; color: #fff; font-variant-numeric: tabular-nums;
                 text-shadow: 0 0 36px rgba(255,255,255,.28); white-space: nowrap; }
  .card .suffix { font-family: "Inter", sans-serif; font-weight: 500; font-size: 34px; line-height: 1; color: #9aa0ae; white-space: nowrap; }
  .card .track { height: 12px; margin-top: 22px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
  .card .fill { height: 100%; width: 0%; border-radius: 6px; background: #3D63F0; }

  .title { position: absolute; top: 6%; left: 10%; width: 80%; text-align: center; opacity: 0;
           font-family: "Inter", sans-serif; font-weight: 500; font-size: 30px; line-height: 1.2; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); }

  /* film look */
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); }
  .grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div id="root" data-composition-id="skit" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURATION}}">
  <video id="shot" class="clip" src="{{CLIP}}" muted playsinline data-start="0" data-duration="{{DURATION}}" data-track-index="0"></video>
  <audio id="voice" src="{{AUDIO}}" data-start="0" data-duration="{{DURATION}}" data-track-index="1"></audio>
  <div id="cards" class="layer" style="top:0;height:100%"></div>
  <div id="caps" class="layer" style="top:0;height:100%"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>
<script type="application/json" id="skit-data">{{DATA}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("skit-data").textContent);
  const root = document.getElementById("root");
  root.classList.add("style-" + D.style);
  const tl = gsap.timeline({ paused: true });
  const mk = (cls, parent, text) => {
    const e = document.createElement("div");
    e.className = cls;
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e);
    return e;
  };

  /* ---------- captions ---------- */
  const capsLayer = document.getElementById("caps");
  const zone = mk("cap-zone", capsLayer);
  const letters = (w) => Math.max(1, w.replace(/[^A-Za-z0-9]/g, "").length);

  D.lines.forEach((ln, i) => {
    const dur = ln.end - ln.start;
    if (D.style === "punch") {
      const words = ln.text.split(/\s+/).filter(Boolean);
      const total = words.reduce((s, w) => s + letters(w), 0);
      let t = ln.start;
      words.forEach((w, k) => {
        const part = dur * letters(w) / total;
        const el = mk("line" + (letters(w) > 6 || k === words.length - 1 ? " hot" : ""), zone, w);
        const t1 = k === words.length - 1 ? ln.end : t + part;
        tl.fromTo(el, { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.07, ease: "power2.out" }, t);
        tl.set(el, { opacity: 0 }, t1);
        t += part;
      });
    } else {
      const el = mk("line", zone, ln.text);
      const inT = D.style === "story" ? Math.min(0.4, dur * 0.5) : Math.min(0.12, dur * 0.4);
      const outT = Math.min(D.style === "story" ? 0.25 : 0.1, dur * 0.3);
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: inT, ease: "none" }, ln.start);
      tl.to(el, { opacity: 0, duration: outT, ease: "none" }, ln.end - outT);
      tl.set(el, { opacity: 0 }, ln.end);
    }
  });

  /* ---------- counter cards ---------- */
  const cardsLayer = document.getElementById("cards");
  const groups = [];
  D.cards.forEach((c) => {
    const g = groups[groups.length - 1];
    if (g && g.label === c.label && c.start - g.end < 0.05) { g.items.push(c); g.end = c.end; }
    else groups.push({ label: c.label, start: c.start, end: c.end, items: [c] });
  });
  const parseVal = (v) => {
    const m = /^(-?\d+(?:\.(\d+))?)(.*)$/.exec(String(v).trim());
    return m ? { n: parseFloat(m[1]), dec: m[2] ? m[2].length : 0, tail: m[3] } : null;
  };
  const fmt = (p, n) => n.toFixed(p.dec) + p.tail;

  groups.forEach((g) => {
    const card = mk("card", cardsLayer);
    mk("label", card, g.label);
    const row = mk("row", card);
    const val = mk("value", row, g.items[0].value);
    const suf = mk("suffix", row, g.items[0].suffix || "");
    const hasBar = g.items.some((c) => c.progress !== undefined);
    const fill = hasBar ? mk("fill", mk("track", card)) : null;
    const pct = (c) => (c.progress !== undefined ? c.progress * 100 : 0) + "%";
    if (fill) fill.style.width = pct(g.items[0]);

    tl.fromTo(card, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, g.start);
    const outT = Math.min(0.2, (g.end - g.start) / 2);
    tl.to(card, { opacity: 0, duration: outT, ease: "none" }, g.end - outT);
    tl.set(card, { opacity: 0 }, g.end);

    for (let k = 1; k < g.items.length; k++) {
      const prev = g.items[k - 1], cur = g.items[k], t = cur.start;
      const a = parseVal(prev.value), b = parseVal(cur.value);
      if (a && b) {
        const proxy = { n: a.n };
        tl.fromTo(proxy, { n: a.n }, { n: b.n, duration: 0.3, ease: "power2.out", immediateRender: false,
          onUpdate: () => { val.textContent = fmt(b, proxy.n); } }, t);
        tl.set(val, { textContent: cur.value }, t + 0.3);
      } else {
        tl.set(val, { textContent: cur.value }, t);
      }
      if (fill) tl.fromTo(fill, { width: pct(prev) }, { width: pct(cur), duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      if ((cur.suffix || "") !== (prev.suffix || "")) tl.set(suf, { textContent: cur.suffix || "" }, t);
    }
  });

  /* ---------- optional title (first 2 s, only when no card is up) ---------- */
  if (D.title && !groups.some((g) => g.start < 2 && g.end > 0)) {
    const el = mk("title", capsLayer, D.title);
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0);
    tl.to(el, { opacity: 0, duration: 0.25, ease: "none" }, 1.75);
    tl.set(el, { opacity: 0 }, 2);
  }

  tl.set({}, {}, D.duration); // timeline spans the full composition
  window.__timelines["skit"] = tl;
})();
</script>
</body>
</html>
